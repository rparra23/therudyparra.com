  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .qr-card { background: #FFFFFF; border-radius: 24px; padding: clamp(20px, 4vw, 36px); box-shadow: 0 18px 60px rgba(0,0,0,0.5); }
    .qr-card svg { display: block; width: min(62vw, 56vh, 440px); height: auto; }
    .qr-name { font-family: 'Newsreader', serif; font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 26px 0 4px; color: var(--text); }
    .qr-sub { color: var(--muted); font-size: clamp(0.95rem, 2.5vw, 1.1rem); margin: 0 0 18px; }
    .qr-hint { font-family: 'Space Mono', ui-monospace, monospace; font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin-bottom: 18px; }
    .qr-toggle { display: inline-flex; gap: 8px; margin-top: 10px; }
    .qr-toggle button { font: inherit; font-size: 0.9rem; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; }
    .qr-toggle button.on { background: var(--accent); border-color: transparent; color: #1F2733; font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>

  <h1 class="qr-name">Rudy Parra</h1>
  <p class="qr-sub">Electrical lab technician &amp; embedded systems developer · Albuquerque, NM</p>
  <div class="qr-toggle">
    <button id="b-site" class="on">My website</button>
    <button id="b-vcf">Save my contact</button>
  </div>
  <script>
    const map = { site: 'Scan to meet Rudy', vcf: 'Scan to save my contact' };
    function show(which) {
      document.getElementById('qr-site').hidden = which !== 'site';
      document.getElementById('qr-vcf').hidden = which !== 'vcf';
      document.getElementById('b-site').classList.toggle('on', which === 'site');
      document.getElementById('b-vcf').classList.toggle('on', which === 'vcf');
      document.getElementById('hint').textContent = map[which];
    }
    document.getElementById('b-site').onclick = () => show('site');
    document.getElementById('b-vcf').onclick = () => show('vcf');
  </script>
  <script>try{navigator.sendBeacon("https://rudy-site.rparra.workers.dev/hit",JSON.stringify({p:location.pathname}))}catch(e){}</script>
