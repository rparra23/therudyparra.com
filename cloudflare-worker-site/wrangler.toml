name = "rudy-site"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Refresh the events cache from the ICS feeds every 6 hours.
[triggers]
crons = ["0 */6 * * *"]

# KV namespace for events cache, leads, pageview counts, and short links.
# setup.sh creates this and fills in the id automatically.
[[kv_namespaces]]
binding = "SITE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
